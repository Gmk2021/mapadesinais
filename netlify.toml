[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/mega-data"
  to = "/.netlify/functions/mega-data"
  status = 200

[[redirects]]
  from = "/api/crypto-radar"
  to = "/.netlify/functions/crypto-radar"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
